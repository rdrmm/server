---
services:
  config-server:
    build: ./config-server
    ports:
      - "8888:8888"

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"

  postgres:
    image: postgres:alpine
    environment:
      POSTGRES_DB: rdrmm
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
    ports:
      - "5432:5432"

  hbs:
    build: ./hbs
    ports:
      - "8081:8081"
    depends_on:
      - config-server
      - redis

  hbw:
    build: ./hbw
    ports:
      - "8082:8082"
    depends_on:
      - config-server
      - redis
      - postgres

  ui:
    build: ./ui
    ports:
      - "8000:8000"
    depends_on:
      - postgres