---
services:
  config-server:
    build: ./config-server
    ports:
      - "8888:8888"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8888/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"

  postgres:
    image: postgres:alpine
    environment:
      POSTGRES_DB: rdrmm
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
    ports:
      - "5432:5432"

  heartbeat:
    build: ./heartbeat
    ports:
      - "8080:8080"
    depends_on:
      config-server:
        condition: service_healthy
      redis:
        condition: service_started
      postgres:
        condition: service_started

  ui:
    build: ./ui
    ports:
      - "8000:8000"
    depends_on:
      - postgres